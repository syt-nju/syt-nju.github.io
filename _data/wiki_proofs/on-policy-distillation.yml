    section_title: "EOPD 的熵门控混合"
    user_concern: "EOPD 为什么能在 student rollout 上混合 FKL；top-k 属于谁；梯度路径、实现成本和实验收益分别是什么"
    claims:
      - id: student-rollout-mixed-objective
        text: "EOPD 始终采用 student rollout；所有 token 保留 clipped RKL PG 项，teacher 高熵位置额外加入 direct FKL，因此整体是 PG-Style 与 GKD-Style 的混合。"
