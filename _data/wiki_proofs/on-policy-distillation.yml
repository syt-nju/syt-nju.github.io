topic: on-policy-distillation
note_path: "_wiki/on-policy-distillation/overview.md"
updated: "2026-08-24"

sections:
  what-is-opd:
    note_path: "_wiki/on-policy-distillation/overview.md"
    section_id: what-is-opd
    section_title: "OPD 在优化什么"
    user_concern: "OPD 的基本概念和最基本的损失函数是什么"
    claims:
      - id: opd-definition
        text: "OPD 是学生自采样轨迹，老师在学生前缀上给 token 级监督。"
        status: solid
        proof:
          - raw_path: raw/on-policy-distillation/2025-10-27-on-policy-distillation.md
            source_title: "On-Policy Distillation"
            source_url: "https://thinkingmachines.ai/blog/on-policy-distillation/"
            source_section: "On-policy distillation — best of both worlds"
            quote: "The core idea of on-policy distillation is to sample trajectories from the student model and use a high-performing teacher to grade each token of each trajectory."
      - id: reverse-kl-formula
        text: "最基本损失是 per-token reverse KL，折扣取 0。"
        status: solid
        proof:
          - raw_path: raw/on-policy-distillation/2025-10-27-on-policy-distillation.md
            source_title: "On-Policy Distillation"
            source_url: "https://thinkingmachines.ai/blog/on-policy-distillation/"
            source_section: "Loss function: reverse KL"
            quote: "For simplicity, we choose the per-token reverse KL"
          - raw_path: raw/on-policy-distillation/2025-10-27-on-policy-distillation.md
            source_title: "On-Policy Distillation"
            source_url: "https://thinkingmachines.ai/blog/on-policy-distillation/"
            source_section: "Loss function: reverse KL"
            quote: "we use a discount factor of zero"
      - id: reverse-kl-needs-support
        text: "reverse KL 是 mode-seeking，需要老师 token 落在学生 support 里。"
        status: solid
        proof:
          - raw_path: raw/on-policy-distillation/2025-10-27-on-policy-distillation.md
            source_title: "On-Policy Distillation"
            source_url: "https://thinkingmachines.ai/blog/on-policy-distillation/"
            source_section: "Loss function: reverse KL"
            quote: "Two other useful properties of reverse KL are that it is “mode seeking”"
          - raw_path: raw/on-policy-distillation/2025-10-27-on-policy-distillation.md
            source_title: "On-Policy Distillation"
            source_url: "https://thinkingmachines.ai/blog/on-policy-distillation/"
            source_section: "after Pseudocode"
            quote: "SFT, using forwards KL, adds support for new tokens. Reverse-KL methods can then perform mode seeking within the initialization’s support."

  pg-vs-gkd:
    note_path: "_wiki/on-policy-distillation/overview.md"
    section_id: pg-vs-gkd
    section_title: "PG-Style v.s. GKD-Style"
    user_concern: "OPD 是否有 PG-Style 和 GKD-Style 两种 loss；为什么 PG advantage 可正可负；两者训练表现有什么差别"
    claims:
      - id: orthogonal-axes
        text: "teacher 信号支持集与 PG/GKD 梯度路径是两个正交轴；sampled-token、top-k、full-vocab 不等同于 PG、GKD。"
        status: solid
        proof:
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "0.3 OPD 的三个核心维度"
            quote: "teacher 信号粒度 | sampled-token / top-k / full-vocab"
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "0.3 OPD 的三个核心维度"
            quote: "优化方式 | direct loss / policy gradient advantage"
          - raw_path: raw/on-policy-distillation/2026-04-17-pg-style-opd-gkd-style-opd.md
            source_title: "从OPD与反向KL的关系到OPD的两种形态以及路线之争"
            source_url: "https://zhuanlan.zhihu.com/p/2027548813129267030"
            source_section: "OPD 是什么？"
            quote: "教师提供的信号具体长什么样”以及”这个信号怎么回传到学生参数"
      - id: advantage-sign
        text: "单个 sampled-token advantage 可正可负；在学生采样下的期望才等于 negative reverse KL，且不大于零。"
        status: solid
        proof:
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "6.1 sampled-token OPD"
            quote: "则 A_t>0，提高该 token 概率。"
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "6.1 sampled-token OPD"
            quote: "如果 teacher 不支持，而 student 自己很支持，则 A_t<0，压低该 token 概率。"
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "12.1–12.2 reverse KL 与 k1"
            quote: "对 KL 无偏；单样本可正可负，方差较高。作为 policy-gradient 的 advantage 使用时最自然。"
            note: "raw 的 k1 是 student-minus-teacher；笔记中的 advantage 取其负值，因此期望是 negative reverse KL。"
      - id: fixed-prefix-gradient-equivalence
        text: "固定前缀与相同 reverse KL 下，PG sampled-token 是 direct distribution gradient 的 Monte Carlo score-function 估计。"
        status: partial
        proof:
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "4. Sequence-level OPD 的梯度推导"
            quote: "这就是 policy-gradient 形式。"
          - raw_path: raw/on-policy-distillation/2026-04-17-pg-style-opd-gkd-style-opd.md
            source_title: "从OPD与反向KL的关系到OPD的两种形态以及路线之争"
            source_url: "https://zhuanlan.zhihu.com/p/2027548813129267030"
            source_section: "GKD-Style OPD"
            quote: "在学生自己采样的前缀上，直接对token-level散度做可微的梯度下降"
            note: "等价只限固定前缀、同一局部 reverse KL 的期望梯度；clip、baseline、mask、top-k 截断或 reward-to-go 会改变实际估计器。"
      - id: variance-and-support-tradeoff
        text: "GKD-Style 通常方差更小、训练更稳定；top-k/full-vocab 还以更多 teacher 分布信息减少 sampled-token 方差。"
        status: solid
        proof:
          - raw_path: raw/on-policy-distillation/2026-04-17-pg-style-opd-gkd-style-opd.md
            source_title: "从OPD与反向KL的关系到OPD的两种形态以及路线之争"
            source_url: "https://zhuanlan.zhihu.com/p/2027548813129267030"
            source_section: "GKD-Style OPD 的推广"
            quote: "在相同rollout预算下，GKD-Style OPD相对于PG-Style OPD的方差更小、训练更稳定"
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "6. sampled-token、top-k、full-vocab"
            quote: "这比 sampled-token 稳定，因为每个 prefix 不只看一个 token，而看 teacher 支持的一组候选。"
      - id: no-universal-head-to-head
        text: "现有材料不足以证明同算力、同支持集、同 KL 方向下某种梯度路径的最终 benchmark 必然更高。"
        status: partial
        proof:
          - raw_path: raw/on-policy-distillation/2026-04-17-pg-style-opd-gkd-style-opd.md
            source_title: "从OPD与反向KL的关系到OPD的两种形态以及路线之争"
            source_url: "https://zhuanlan.zhihu.com/p/2027548813129267030"
            source_section: "GKD-Style OPD 的推广"
            quote: "在相同rollout预算下，GKD-Style OPD相对于PG-Style OPD的方差更小、训练更稳定"
            note: "该材料支持方差与稳定性判断，但没有给出同算力、同支持集、同 KL 方向的普适最终 benchmark 结论。"
      - id: pg-implementation-scope
        text: "该 PG 实现复用组采样但不做组内 advantage normalization；discount=0 只使用当前 token 信号，并调用 importance-sampling loss。"
        status: solid
        proof:
          - raw_path: raw/on-policy-distillation/2026-04-17-pg-style-opd-gkd-style-opd.md
            source_title: "从OPD与反向KL的关系到OPD的两种形态以及路线之争"
            source_url: "https://zhuanlan.zhihu.com/p/2027548813129267030"
            source_section: "PG-Style OPD"
            quote: "这里只是借用了”组采样”这一形式，并没有启用 GRPO 里那套组内优势归一化的机制"
          - raw_path: raw/on-policy-distillation/2026-04-17-pg-style-opd-gkd-style-opd.md
            source_title: "从OPD与反向KL的关系到OPD的两种形态以及路线之争"
            source_url: "https://zhuanlan.zhihu.com/p/2027548813129267030"
            source_section: "PG-Style OPD"
            quote: "discount factor=0：博客实现里，advantage 只等于当前 token 的 reverse-KL 信号，而不把未来 token 的 reward 折扣回传"
          - raw_path: raw/on-policy-distillation/2025-10-27-on-policy-distillation.md
            source_title: "On-Policy Distillation"
            source_url: "https://thinkingmachines.ai/blog/on-policy-distillation/"
            source_section: "Pseudocode step 4"
            quote: "call the RL importance-sampling loss function to perform the training update"

  rkl-vs-fkl:
    note_path: "_wiki/on-policy-distillation/overview.md"
    section_id: rkl-vs-fkl
    section_title: "RKL v.s. FKL"
    user_concern: "RKL 与 top-k FKL 到底差在哪里；分析时如何区分 sampled-token、top-k 和 full-vocab"
    claims:
      - id: kl-direction-behavior
        text: "RKL 按 student 概率加权并呈 mode-seeking；FKL 按 teacher 概率加权并呈 mode-covering。"
        status: solid
        proof:
          - raw_path: raw/on-policy-distillation/2026-03-07-entropy-aware-on-policy-distillation.md
            source_title: "Entropy-Aware On-Policy Distillation of Language Models"
            source_url: "https://arxiv.org/abs/2603.07079"
            source_section: "Equations 2–3 and Section 2.1"
            quote: "It penalizes the student for assigning low probability to any token the teacher considers likely."
          - raw_path: raw/on-policy-distillation/2026-03-07-entropy-aware-on-policy-distillation.md
            source_title: "Entropy-Aware On-Policy Distillation of Language Models"
            source_url: "https://arxiv.org/abs/2603.07079"
            source_section: "Equation 3 and Section 2.1"
            quote: "penalizes generated tokens that the teacher considers unlikely, but ignores teacher modes that the student does not visit"
      - id: direction-vs-support
        text: "KL 方向与 sampled-token、top-k、full-vocab 支持集是正交轴；top-k 和 full-vocab 可以采用同一 KL 方向。"
        status: solid
        proof:
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "0.3 OPD 的三个核心维度"
            quote: "teacher 信号粒度 | sampled-token / top-k / full-vocab"
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "6.2–6.3 sampled-token、top-k、full-vocab"
            quote: "可以做 forward KL："
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "6.2–6.3 sampled-token、top-k、full-vocab"
            quote: "也可以做 support-set reverse KL。"
      - id: sampled-token-direction
        text: "student sampled-token 是 RKL 的 Monte Carlo 信号；FKL 按 teacher 概率加权，需要 teacher sample 或 teacher top-k/full-vocab。"
        status: solid
        proof:
          - raw_path: raw/on-policy-distillation/2026-03-07-entropy-aware-on-policy-distillation.md
            source_title: "Entropy-Aware On-Policy Distillation of Language Models"
            source_url: "https://arxiv.org/abs/2603.07079"
            source_section: "Equations 2–3 and Section 2.2"
            quote: "use a single-sample Monte‑Carlo estimate of the expectation in (3)"
          - raw_path: raw/on-policy-distillation/2026-03-07-entropy-aware-on-policy-distillation.md
            source_title: "Entropy-Aware On-Policy Distillation of Language Models"
            source_url: "https://arxiv.org/abs/2603.07079"
            source_section: "Equation 2"
            quote: "The forward KL divergence is defined as an expectation over the teacher’s distribution"
          - raw_path: raw/on-policy-distillation/2026-03-07-entropy-aware-on-policy-distillation.md
            source_title: "Entropy-Aware On-Policy Distillation of Language Models"
            source_url: "https://arxiv.org/abs/2603.07079"
            source_section: "Equation 10"
            quote: "computed over the teacher’s top-k tokens"
      - id: support-cost
        text: "top-k 截断 teacher 尾部并使用 [B,T,K] 信号；full-vocab 保留整个词表并承担 [B,T,V] 存储与访存成本。"
        status: partial
        proof:
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "6.2–6.4 sampled-token、top-k、full-vocab"
            quote: "这是信息最完整的版本，但显存和计算代价最大。"
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "15.1 verl 支持两类 distillation"
            quote: "teacher_logprobs: [B, L, K]"
            note: "[B,T,V] 成本来自 full-vocab 公式和张量形状的工程判断；raw 没有端到端成本测量。"
      - id: eopd-not-direction-isolation
        text: "EOPD 同时改变 KL 方向、支持集、梯度路径和位置选择；实验未提供同支持集 teacher top-k direct RKL 对照，不能把增益严格归因于 FKL 方向。"
        status: partial
        proof:
          - raw_path: raw/on-policy-distillation/2026-03-07-entropy-aware-on-policy-distillation.md
            source_title: "Entropy-Aware On-Policy Distillation of Language Models"
            source_url: "https://arxiv.org/abs/2603.07079"
            source_section: "Equations 8–10"
            quote: "L_t^EOPD = L_t^OPD + I[H_t^te > tau] L_t^FKL"
          - raw_path: raw/on-policy-distillation/2026-03-07-entropy-aware-on-policy-distillation.md
            source_title: "Entropy-Aware On-Policy Distillation of Language Models"
            source_url: "https://arxiv.org/abs/2603.07079"
            source_section: "Equation 10"
            quote: "approximated not by sampling, but as an expectation computed over the teacher’s top-k tokens"
          - raw_path: raw/on-policy-distillation/2026-03-07-entropy-aware-on-policy-distillation.md
            source_title: "Entropy-Aware On-Policy Distillation of Language Models"
            source_url: "https://arxiv.org/abs/2603.07079"
            source_section: "Section 5.6 and Table 6"
            quote: "full forward KL, applied at all token positions ... and random forward KL, applied to a randomly selected 20% of positions"
            note: "消融比较 FKL 的位置选择，没有同支持集 teacher top-k direct RKL；证据边界因此为 partial。"
      - id: eopd-bounded-conclusion
        text: "当前证据只支持在 sampled-token PG RKL 上对 teacher 高熵位置增加 top-k FKL，可改善该设定的多样性与 Pass@k。"
        status: partial
        proof:
          - raw_path: raw/on-policy-distillation/2026-03-07-entropy-aware-on-policy-distillation.md
            source_title: "Entropy-Aware On-Policy Distillation of Language Models"
            source_url: "https://arxiv.org/abs/2603.07079"
            source_section: "Section 5.2 and Figure 2"
            quote: "EOPD achieves higher Pass@k compared to OPD."
          - raw_path: raw/on-policy-distillation/2026-03-07-entropy-aware-on-policy-distillation.md
            source_title: "Entropy-Aware On-Policy Distillation of Language Models"
            source_url: "https://arxiv.org/abs/2603.07079"
            source_section: "Section 5.4 Token-Level Entropy Analysis"
            quote: "EOPD retains substantially more probability mass in this region and stays much closer to the teacher"
            note: "仅限论文中的数学任务、模型与训练设置，不构成 FKL 方向的普适优越性证明。"

  k1-k2-k3:
    note_path: "_wiki/on-policy-distillation/overview.md"
    section_id: k1-k2-k3
    section_title: "K1 / K2 / K3"
    user_concern: "K1、K2、K3 的偏差、方差、非负性和训练成本有何差别；K2 是否是 GRPO 的 KL；这些 estimator 是否只是被复用到 OPD"
    claims:
      - id: estimator-properties
        text: "K1 数值无偏但可正可负；K2 非负、平滑但有偏，只是分布接近时的局部二阶 surrogate；K3 借助 control variate 保持数值无偏和非负。"
        status: disputed
        proof:
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "12.2–12.4 k1 / k2 / k3"
            quote: "始终非负、方差更小；对真实 KL 有偏，是其局部二阶近似。"
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "12.4 k3：无偏且非负"
            quote: "利用恒等式 E_{y~P_S}[P_T(y)/P_S(y)]=1 即可得到 E[k_3]=D_{KL}(P_S||P_T)"
          - raw_path: raw/on-policy-distillation/2026-04-17-pg-style-opd-gkd-style-opd.md
            source_title: "从OPD与反向KL的关系到OPD的两种形态以及路线之争"
            source_url: "https://zhuanlan.zhihu.com/p/2027548813129267030"
            source_section: "GKD-Style OPD 的推广"
            quote: "K2是 1/2(log pi_theta-log pi_T)^2这样的无偏、恒非负的近似"
            note: "该 raw 把 K2 写成无偏，与另一份 raw 的公式和结论冲突；公开笔记采用 K2 有偏的矫正结论。"
      - id: k3-variance-scope
        text: "K3 在策略接近参考模型时通常比 K1 方差低，但极端 ratio 下不保证低方差，exp 需要数值稳定处理。"
        status: partial
        proof:
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "12.4–12.6 k3 与 verl 实现"
            quote: "所以 k3 保留无偏性，同时非负、方差低于 k1。"
            note: "raw 支持低方差方向和 exp 实现；‘接近时通常’及极端 ratio 限定来自 estimator 性质判断，避免把低方差写成普适保证。"
      - id: grpo-uses-k3
        text: "原始 GRPO 的 KL 项是 K3，不是 K2；K3 在 log-ratio 接近零时二阶展开近似 K2。"
        status: disputed
        proof:
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "12.3–12.4 k2 / k3"
            quote: "k_3=P_T(y_t|c_t)/P_S(y_t|c_t)-log(P_T(y_t|c_t)/P_S(y_t|c_t))-1"
            note: "该 raw 给出 K3 公式，但未直接引用原始 GRPO 公式；GRPO 归属证据在当前 named raw 中不完整。"
          - raw_path: raw/on-policy-distillation/2026-04-17-pg-style-opd-gkd-style-opd.md
            source_title: "从OPD与反向KL的关系到OPD的两种形态以及路线之争"
            source_url: "https://zhuanlan.zhihu.com/p/2027548813129267030"
            source_section: "GKD-Style OPD 的推广"
            quote: "K2的形式恰好和 DeepSeek-R1官方训练方法所使用的参考模型KL惩罚项一致"
            note: "该归属与矫正结论冲突，proof 保留冲突；公开笔记不重复该说法。"
      - id: value-vs-gradient-unbiasedness
        text: "数值无偏不等于 direct backprop 或 detached PG reward 的梯度无偏，不能仅凭 estimator 数值期望相同就互换。"
        status: solid
        proof:
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "12.6 verl 里的 k1/k2/k3 与 k3+"
            quote: "k1/k3 的数值期望等于 KL，但直接反传它们时，梯度期望不一定等于真实 KL 的梯度"
          - raw_path: raw/on-policy-distillation/2026-04-17-pg-style-opd-gkd-style-opd.md
            source_title: "从OPD与反向KL的关系到OPD的两种形态以及路线之争"
            source_url: "https://zhuanlan.zhihu.com/p/2027548813129267030"
            source_section: "PG-Style OPD 的推广"
            quote: "这种替换改变的是信号的计算方式，并不影响整个优化器仍然是 advantage × logπ(sampled action) 这个PG surrogate"
      - id: estimators-predate-opd
        text: "K1/K2/K3 是早于 OPD 的 KL approximation；替换为 teacher/student ratio 不构成新的估计理论。"
        status: solid
        proof:
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "12. k1/k2/k3"
            quote: "k1、k2、k3 都是对 reverse KL 的单样本估计器，常见于 Schulman 的 KL approximation 讨论。"
      - id: estimator-compute-cost
        text: "已有 sampled-token 双方 logprob 后，K1/K2/K3 只增加 [B,T] 逐元素运算；主要成本是 teacher/reference forward，以及 top-k/full-vocab 扩大信号张量。"
        status: partial
        proof:
          - raw_path: raw/on-policy-distillation/2026-04-17-pg-style-opd-gkd-style-opd.md
            source_title: "从OPD与反向KL的关系到OPD的两种形态以及路线之争"
            source_url: "https://zhuanlan.zhihu.com/p/2027548813129267030"
            source_section: "GKD-Style OPD 的推广"
            quote: "K2/K3 不花额外开销就能改善一些性质；full-vocab 则是精度最高但成本最贵。"
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析：从数学推导到DeepSeek V4、SWIFT与verl实践"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "15.1 verl 支持两类 distillation"
            quote: "teacher_logprobs: [B, L, K]"
            note: "逐元素算子与临时张量数量是基于公式和张量形状的工程判断，raw 没有直接给出端到端成本测量。"

  sampled-token-cost:
    note_path: "_wiki/on-policy-distillation/overview.md"
    section_id: sampled-token-cost
    section_title: "sampled-token v.s. GRPO 训练框架"
    user_concern: "sampled-token 是不是最早的 OPD，以及能否在基于 GRPO 的训练框架里快速改出"
    claims:
      - id: sampled-token-not-first
        text: "sampled-token 不是最早的 OPD 方案；此前已有学生自生成轨迹上的语言模型蒸馏工作。"
        status: solid
        proof:
          - raw_path: raw/on-policy-distillation/2025-10-27-on-policy-distillation.md
            source_title: "On-Policy Distillation"
            source_url: "https://thinkingmachines.ai/blog/on-policy-distillation/"
            source_section: "On-policy distillation — best of both worlds"
            quote: "We extend prior on-policy distillation work by Agarwal et al, On-Policy Distillation of Language Models: Learning from Self-Generated Mistakes(Agarwal et al, 2023) Gu et al, MiniLLM: Knowledge Distillation of Large Language Models(Gu et al, 2023) and the Qwen3 team"
      - id: rl-skeleton-reuse
        text: "具备逐 token rollout、logprob、advantage 与 importance-sampling 接口时可以复用 RL/GRPO 类训练骨架，但 raw 没有证明任意 GRPO trainer 都只需一两行修改。"
        status: partial
        proof:
          - raw_path: raw/on-policy-distillation/2025-10-27-on-policy-distillation.md
            source_title: "On-Policy Distillation"
            source_url: "https://thinkingmachines.ai/blog/on-policy-distillation/"
            source_section: "Pseudocode"
            quote: "Our implementation can actually be a one-line change on top of RL implementations which use KL regularization: we merely swap out the regularizer model."
            note: "原文范围是带 KL regularization 的 RL implementations，不是任意 GRPO trainer。"
          - raw_path: raw/on-policy-distillation/2025-10-27-on-policy-distillation.md
            source_title: "On-Policy Distillation"
            source_url: "https://thinkingmachines.ai/blog/on-policy-distillation/"
            source_section: "Pseudocode step 4"
            quote: "We set the per-token advantage to the negative reverse KL, and call the RL importance-sampling loss function"
            note: "支持复用 per-token advantage 与 importance-sampling 更新接口；不支持扩写 group normalization 或 clip 公式。"
      - id: teacher-token-signal
        text: "老师给出的逐 token logprob 差是 OPD 主监督，不是按组归一化的 sequence-level verifier advantage。"
        status: solid
        proof:
          - raw_path: raw/on-policy-distillation/2025-10-27-on-policy-distillation.md
            source_title: "On-Policy Distillation"
            source_url: "https://thinkingmachines.ai/blog/on-policy-distillation/"
            source_section: "Pseudocode steps 3–4"
            quote: "teacher’s logprobs log pi_teacher(x) on the tokens x sampled by the student"
          - raw_path: raw/on-policy-distillation/2025-10-27-on-policy-distillation.md
            source_title: "On-Policy Distillation"
            source_url: "https://thinkingmachines.ai/blog/on-policy-distillation/"
            source_section: "Pseudocode"
            quote: "reverse_kl = sampled_logprobs - teacher_logprobs"
      - id: sampled-token-only-logprob
        text: "sampled-token 只需要老师对 sampled token 的 logprob，不要 top-k 或 full logits。"
        status: solid
        proof:
          - raw_path: raw/on-policy-distillation/2025-10-27-on-policy-distillation.md
            source_title: "On-Policy Distillation"
            source_url: "https://thinkingmachines.ai/blog/on-policy-distillation/"
            source_section: "Pseudocode step 3"
            quote: "In this post, we do not consider logit (top-k) distillation in any of our experiments"
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "6.1 sampled-token OPD"
            quote: "它不需要 teacher top-k，也不需要 full logits，只需要："
      - id: full-vocab-memory
        text: "full-vocab 的主成本是显存和搬运，不是前面层反传变贵；V4 靠不缓存 logits、只留 hidden。"
        status: partial
        proof:
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "6.3 full-vocab OPD"
            quote: "这是信息最完整的版本，但显存和计算代价最大。"
          - raw_path: raw/on-policy-distillation/zhihu-opd-deep-dive-v2.md
            source_title: "OPD深度解析"
            source_url: "https://zhuanlan.zhihu.com/p/2033212181823608430"
            source_section: "13.1 为什么它能做 full-vocab？"
            quote: "teacher forward 时不显式缓存完整 logits"
            note: "V4 工程细节转述自知乎文，V4 技术报告本身未入库。前面层反传复杂度不变是实现层推理，不是来源原句。"

