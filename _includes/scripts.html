{% if page.url == "/wiki/" %}
  {% if site.github.build_revision %}
    {% assign wiki_asset_version = site.github.build_revision %}
  {% else %}
    {% assign wiki_asset_version = site.time | date: "%s" %}
  {% endif %}
  <script src="{{ base_path }}/assets/js/wiki-search.js?v={{ wiki_asset_version }}"></script>
{% endif %}
